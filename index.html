<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-5OUA95KYdcxY9wIk5NOYevbrWKA9LA4nMvbe3u+s2Mw='; style-src 'sha256-WIoag5H+FhQkEN6Fx05noceViNC2B1WCTssnLfdezsA='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Jarvis connect</title>
<style>:root { color-scheme: light dark; }
body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: Canvas; color: CanvasText; }
main { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
h1 { font-size: 20px; margin: 0 0 8px; }
textarea { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 10px; border-radius: 8px; border: 1px solid GrayText; background: Field; color: FieldText; resize: none; }
</style>
</head>
<body>
<main>
<h1>Almost done</h1>
<p id="msg">Copy the address below (it is already selected: press Cmd+C), paste it into the Terminal window that asked for it, then close this tab.</p>
<textarea id="addr" rows="5" readonly aria-label="Address to copy"></textarea>
<noscript><p>Copy the full address from the address bar instead.</p></noscript>
</main>
<script>(function () {
  var box = document.getElementById('addr');
  var msg = document.getElementById('msg');
  if (!/[?&](code|error)=/.test(location.search)) {
    msg.textContent = 'Nothing to copy here. This page only receives the Instagram connection for Jarvis.';
    box.hidden = true;
    return;
  }
  box.value = location.href.split('#')[0];
  box.focus();
  box.select();
  history.replaceState(null, '', location.pathname);
})();
</script>
</body>
</html>
